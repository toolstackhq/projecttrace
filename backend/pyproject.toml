[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "projecttrace-backend"
version = "0.1.0"
description = "ProjectTrace FastAPI backend"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.1",
  "alembic>=1.13",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "python-dotenv>=1.0",
  "email-validator>=2.2",
  "faker>=25.0",
  "PyJWT>=2.9",
]

[tool.setuptools.packages.find]
where = ["."]
